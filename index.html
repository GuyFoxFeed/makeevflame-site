<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* NAV */
.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px;
}

.nav a{
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GRID */
.content{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */
.carousel-track{
  display:flex;
  transition:0.5s;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* SHOP */
.shop{
  grid-column:1 / -1;
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.product{
  background:#131313;
  color:white;
  padding:10px;
}

.product img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
}

/* CART */
.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:flex-end;
  z-index:999;
}

.cart-content{
  width:380px;
  height:100%;
  background:#111;
  padding:20px;
  display:flex;
  flex-direction:column;
}

.cart-items{
  flex:1;
  overflow:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#1b1b1b;
  margin-bottom:8px;
}

/* DELETE BUTTON */
.remove{
  background:red;
  color:white;
  border:none;
  padding:5px 8px;
  cursor:pointer;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
}

.toast.show{
  opacity:1;
}

</style>
</head>

<body>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина (<span id="cartCount">0</span>)</a>
</nav>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- CONTENT -->
<section class="content">

<!-- CAROUSEL -->
<div class="block">
  <div class="carousel">
    <div class="carousel-track" id="track">

      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_5047.jpeg?raw=true')"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4876.jpg?raw=true')"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4825.jpeg?raw=true')"></div>

    </div>
  </div>
</div>

<!-- ABOUT -->
<div class="block">
  <h2>О бренде</h2>
  <p>Свечи ручной работы</p>
</div>

<!-- SHOP -->
<section class="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602526219685-1f3b9b7b9b7b">
    <h3>Свеча 1</h3>
    <button onclick="addToCart('Свеча 1',1290)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602874801006-5c6a3f0c4f13">
    <h3>Свеча 2</h3>
    <button onclick="addToCart('Свеча 2',1490)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1616628182506-6c3a0f7c3b8c">
    <h3>Свеча 3</h3>
    <button onclick="addToCart('Свеча 3',1590)">Купить</button>
  </div>

</div>

</section>

</section>

<!-- CART -->
<div id="cartModal" class="cart-modal">

<div class="cart-content">

  <h2>Корзина</h2>

  <div id="cartItems" class="cart-items"></div>

  <p id="cartTotal"></p>

  <button onclick="closeCart()">Закрыть</button>

</div>

</div>

<div id="toast" class="toast"></div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

/* ADD + SUMMING */
function addToCart(name, price){

  price = Number(price);

  let item = cart.find(i => i.name === name);

  if(item){
    item.qty += 1;
  } else {
    cart.push({name, price, qty:1});
  }

  save();
  updateCart();
  showToast("Добавлено в корзину");
}

/* REMOVE ITEM */
function removeItem(index){
  cart.splice(index,1);
  save();
  updateCart();
}

/* UPDATE CART */
function updateCart(){

  document.getElementById("cartCount").innerText =
    cart.reduce((a,b)=>a + b.qty,0);

  let html = "";
  let total = 0;

  cart.forEach((i,idx)=>{
    total += i.price * i.qty;

    html += `
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price * i.qty} ₽</span>
        <button class="remove" onclick="removeItem(${idx})">×</button>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("cartTotal").innerText = "Итого: " + total + " ₽";
}

/* CART OPEN */
const cartModal = document.getElementById("cartModal");

document.getElementById("cartBtn").addEventListener("click",(e)=>{
  e.preventDefault();
  cartModal.style.display = "flex";
});

function closeCart(){
  cartModal.style.display = "none";
}

/* OUTSIDE CLOSE */
cartModal.addEventListener("click",(e)=>{
  if(e.target === cartModal) closeCart();
});

/* TOAST */
function showToast(text){
  let t = document.getElementById("toast");
  t.innerText = text;
  t.classList.add("show");

  setTimeout(()=>t.classList.remove("show"),1500);
}

updateCart();

</script>

</body>
</html>
