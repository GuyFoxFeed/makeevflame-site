<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAKEEV свечи ручной работы</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Helvetica, Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* NAV */

.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px 10px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* HERO */

.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GRID */

.content{
  display:grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap:40px;
  align-items:start;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */

.carousel-track{
  display:flex;
  transition:0.5s;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:16px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
  cursor:pointer;
}

.dot.active{
  background:white;
}

/* SHOP */

.shop{
  grid-column:1 / -1;
  padding:60px 20px;
  background:#e8e8ec;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
  max-width:1100px;
  margin:0 auto;
}

.product{
  background:#131313;
  color:white;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.product button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
}

/* FOOTER */

.footer{
  width:100%;
  background:#131313;
  color:white;
  padding:30px 20px;
}

.footer-content{
  max-width:900px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  opacity:0.8;
}

/* ================= CART UI ================= */

.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  display:none;
  justify-content:flex-end;
  z-index:999;
}

.cart-content{
  width:360px;
  height:100%;
  background:#111;
  color:white;
  padding:24px;
  transform:translateX(100%);
  animation:slideIn 0.35s ease forwards;
  display:flex;
  flex-direction:column;
  gap:12px;
}

@keyframes slideIn{
  to{transform:translateX(0);}
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  background:none;
  border:none;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow-y:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b1b1b;
  border-radius:10px;
  margin-bottom:8px;
  animation:pop 0.2s ease;
}

@keyframes pop{
  from{transform:scale(0.95); opacity:0;}
  to{transform:scale(1); opacity:1;}
}

.cart-footer{
  border-top:1px solid #333;
  padding-top:10px;
}

.checkout-btn{
  width:100%;
  padding:12px;
  border:none;
  background:white;
  color:black;
  cursor:pointer;
  font-weight:bold;
  border-radius:8px;
}

/* MOBILE */

@media (max-width:768px){
  .content{
    grid-template-columns:1fr;
  }

  .shop-grid{
    grid-template-columns:1fr;
  }

  .slide{
    height:350px;
  }
}

</style>

</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина (<span id="cartCount">0</span>)</a>
</nav>

<!-- CONTENT -->
<section class="content">

  <!-- CAROUSEL -->
  <div class="block">

    <div class="carousel">
      <div class="carousel-track" id="track">

        <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_5047.jpeg?raw=true');"></div>
        <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4876.jpg?raw=true');"></div>
        <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4825.jpeg?raw=true');"></div>

      </div>
    </div>

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

  </div>

  <!-- ABOUT -->
  <div class="block">
    <h2>О бренде</h2>
    <p style="opacity:0.7; line-height:1.6;">
      Макеев — это ручные свечи, сделанные с вниманием к деталям и атмосфере.
    </p>
  </div>

  <!-- SHOP -->
  <section class="shop" id="shop">

    <h2 class="shop-title">Магазин</h2>

    <div class="shop-grid">

      <div class="product">
        <img src="https://via.placeholder.com/400">
        <h3>Свеча 1</h3>
        <span>1290 ₽</span>
        <button onclick="addToCart('Свеча 1',1290)">Купить</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/400">
        <h3>Свеча 2</h3>
        <span>1490 ₽</span>
        <button onclick="addToCart('Свеча 2',1490)">Купить</button>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/400">
        <h3>Свеча 3</h3>
        <span>1590 ₽</span>
        <button onclick="addToCart('Свеча 3',1590)">Купить</button>
      </div>

    </div>

  </section>

</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <p>© 2026 MAKEEV. Все права защищены.</p>
    <p>НПД: Макеева Екатерина Игоревна</p>
    <p>ИНН: 631406784709</p>
    <p>+7 917 159 74 55</p>
  </div>
</footer>

<!-- CART -->
<div id="cartModal" class="cart-modal">

  <div class="cart-content">

    <div class="cart-header">
      <h2>Корзина</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <p id="cartTotal">Итого: 0 ₽</p>
      <button class="checkout-btn">Оформить заказ</button>
    </div>

  </div>

</div>

<script>

/* CAROUSEL */

const track = document.getElementById('track');
const dots = document.querySelectorAll('.dot');

let index = 0;

function updateCarousel(){
  track.style.transform = `translateX(-${index * 100}%)`;
  dots.forEach(d => d.classList.remove('active'));
  dots[index].classList.add('active');
}

dots.forEach((d,i)=>{
  d.addEventListener('click',()=>{
    index = i;
    updateCarousel();
  });
});

setInterval(()=>{
  index++;
  if(index > 2) index = 0;
  updateCarousel();
},4000);

/* CART */

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){
  cart.push({name, price});
  saveCart();
  updateCart();
}

function removeItem(i){
  cart.splice(i,1);
  saveCart();
  updateCart();
}

function updateCart(){

  document.getElementById("cartCount").innerText = cart.length;

  let items = document.getElementById("cartItems");
  items.innerHTML = "";

  let total = 0;

  cart.forEach((item,i)=>{
    total += item.price;

    items.innerHTML += `
      <div class="cart-item">
        <span>${item.name} - ${item.price} ₽</span>
        <button onclick="removeItem(${i})">x</button>
      </div>
    `;
  });

  document.getElementById("cartTotal").innerText =
    "Итого: " + total + " ₽";
}

document.getElementById("cartBtn").addEventListener("click",(e)=>{
  e.preventDefault();
  document.getElementById("cartModal").style.display="flex";
});

function closeCart(){
  document.getElementById("cartModal").style.display="none";
}

updateCart();

</script>

</body>
</html>
