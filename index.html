<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* NAV */
.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
}

/* HERO */
.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GRID */
.content{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */
.carousel{
  overflow:hidden;
  width:100%;
}

.carousel-track{
  display:flex;
  transition:transform 0.5s ease;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* DOTS */
.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
  cursor:pointer;
}

.dot.active{
  background:white;
}

/* SHOP */
.shop{
  grid-column:1 / -1;
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
  max-width:1100px;
  margin:0 auto;
}

.product{
  background:#131313;
  color:white;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* Shopify feel buttons */
button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
  transition:transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,0.2);
}

button:active{
  transform:scale(0.96);
  opacity:0.85;
}

/* FOOTER */
.footer{
  background:#131313;
  color:white;
  padding:30px;
  text-align:center;
}

/* ================= CART (SHOPIFY STYLE) ================= */

.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(4px);
  display:none;
  justify-content:flex-end;
  z-index:999;
}

.cart-modal.active{
  display:flex;
}

.cart-content{
  width:380px;
  height:100%;
  background:#111;
  padding:24px;
  color:white;
  transform:translateX(100%);
  animation:slideIn 0.35s ease forwards;
  display:flex;
  flex-direction:column;
}

@keyframes slideIn{
  to{transform:translateX(0);}
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close-btn{
  background:none;
  color:white;
  font-size:20px;
}

.cart-items{
  flex:1;
  overflow-y:auto;
  margin-top:10px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b1b1b;
  margin-bottom:8px;
  border-radius:8px;
}

.cart-footer{
  border-top:1px solid #333;
  padding-top:10px;
}

.checkout-btn{
  width:100%;
  padding:12px;
  background:white;
  color:black;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:12px 18px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-5px);
}

/* MOBILE */
@media(max-width:768px){
  .content{
    grid-template-columns:1fr;
  }

  .shop-grid{
    grid-template-columns:1fr;
  }

  .slide{
    height:350px;
  }
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина (<span id="cartCount">0</span>)</a>
</nav>

<!-- CONTENT -->
<section class="content">

<!-- CAROUSEL -->
<div class="block">
  <div class="carousel">
    <div class="carousel-track" id="track">

      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_5047.jpeg?raw=true');"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4876.jpg?raw=true');"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4825.jpeg?raw=true');"></div>

    </div>
  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<!-- ABOUT -->
<div class="block">
  <h2>О бренде</h2>
  <p>Минималистичные свечи ручной работы.</p>
</div>

<!-- SHOP -->
<section class="shop" id="shop">

  <h2 class="shop-title">Магазин</h2>

  <div class="shop-grid">

    <div class="product">
      <h3>Свеча 1</h3>
      <button onclick="addToCart('Свеча 1',1290)">Купить</button>
    </div>

    <div class="product">
      <h3>Свеча 2</h3>
      <button onclick="addToCart('Свеча 2',1490)">Купить</button>
    </div>

    <div class="product">
      <h3>Свеча 3</h3>
      <button onclick="addToCart('Свеча 3',1590)">Купить</button>
    </div>

  </div>

</section>

</section>

<!-- FOOTER -->
<footer class="footer">
  © 2026 MAKEEV
</footer>

<!-- CART -->
<div id="cartModal" class="cart-modal">

  <div class="cart-content">

    <div class="cart-header">
      <h2>Корзина</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-footer">
      <p id="cartTotal"></p>
      <button class="checkout-btn">Оформить</button>
    </div>

  </div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>

/* CAROUSEL */
const track = document.getElementById('track');
const dots = document.querySelectorAll('.dot');
let index = 0;

function updateCarousel(){
  track.style.transform = `translateX(-${index * 100}%)`;
  dots.forEach(d=>d.classList.remove('active'));
  dots[index].classList.add('active');
}

dots.forEach((d,i)=>{
  d.addEventListener('click',()=>{
    index=i;
    updateCarousel();
  });
});

setInterval(()=>{
  index++;
  if(index>2) index=0;
  updateCarousel();
},4000);

/* CART */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){

  let item = cart.find(i=>i.name===name);

  if(item) item.qty++;
  else cart.push({name,price,qty:1});

  save();
  updateCart();
  showToast("Добавлено 🕯️");
}

function updateCart(){

  document.getElementById("cartCount").innerText =
    cart.reduce((a,b)=>a+b.qty,0);

  let html="";
  let total=0;

  cart.forEach((i,idx)=>{
    total += i.price*i.qty;

    html+=`
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price*i.qty} ₽</span>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML=html;
  document.getElementById("cartTotal").innerText="Итого: "+total+" ₽";
}

function removeItem(i){
  cart.splice(i,1);
  save();
  updateCart();
}

/* CART OPEN */
const cartModal=document.getElementById("cartModal");

document.getElementById("cartBtn").onclick=(e)=>{
  e.preventDefault();
  cartModal.classList.add("active");
};

function closeCart(){
  cartModal.classList.remove("active");
}

/* CLICK OUTSIDE */
cartModal.addEventListener("click",(e)=>{
  if(e.target===cartModal) closeCart();
});

/* TOAST */
function showToast(text){
  let t=document.getElementById("toast");
  t.innerText=text;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

updateCart();

</script>

</body>
</html>
