<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  color:#e8e8ec;
}

/* NAV */
.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px;
}

.nav a{
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* GRID */
.content{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */
.carousel{
  overflow:hidden;
}

.carousel-track{
  display:flex;
  transition:0.5s;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* DOTS */
.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#555;
}

.dot.active{
  background:white;
}

/* SHOP */
.shop{
  grid-column:1/-1;
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
  max-width:1100px;
  margin:0 auto;
}

/* PRODUCT CARD FIXED */
.product{
  background:#131313;
  color:white;
  border-radius:12px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  transition:0.2s;
}

.product:hover{
  transform:translateY(-3px);
}

.product img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.product-content{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.product button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
  transition:0.2s;
}

.product button:active{
  transform:scale(0.96);
}

/* FOOTER */
.footer{
  background:#131313;
  color:white;
  padding:30px;
  text-align:center;
}

/* CART */
.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:flex-end;
  z-index:999;
}

.cart-modal.active{
  display:flex;
}

.cart-content{
  width:360px;
  height:100%;
  background:#111;
  padding:24px;
  display:flex;
  flex-direction:column;
}

.cart-items{
  flex:1;
  overflow-y:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b1b1b;
  margin-bottom:8px;
}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:white;
  padding:10px 16px;
  border-radius:10px;
  opacity:0;
  transition:0.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-5px);
}

/* MOBILE */
@media(max-width:768px){
  .content{
    grid-template-columns:1fr;
  }

  .shop-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина (<span id="cartCount">0</span>)</a>
</nav>

<!-- HERO -->
<section class="hero">
  <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba">
</section>

<!-- CONTENT -->
<section class="content">

<div class="block">
  <div class="carousel">
    <div class="carousel-track" id="track">
      <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')"></div>
      <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1501004318641-b39e6451bec6')"></div>
      <div class="slide" style="background-image:url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429')"></div>
    </div>
  </div>
</div>

<div class="block">
  <h2>О бренде</h2>
  <p>Ручные свечи с атмосферой минимализма.</p>
</div>

<!-- SHOP -->
<section class="shop" id="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602874801006-5c6a3f0c4f13">
    <div class="product-content">
      <h3>Свеча Vanilla</h3>
      <button onclick="addToCart('Vanilla',1290)">Купить</button>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1616628182506-6c3a0f7c3b8c">
    <div class="product-content">
      <h3>Свеча Wood</h3>
      <button onclick="addToCart('Wood',1490)">Купить</button>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602526219685-1f3b9b7b9b7b">
    <div class="product-content">
      <h3>Свеча Amber</h3>
      <button onclick="addToCart('Amber',1590)">Купить</button>
    </div>
  </div>

</div>

</section>

</section>

<!-- FOOTER -->
<footer class="footer">
© 2026 MAKEEV
</footer>

<!-- CART -->
<div id="cartModal" class="cart-modal">

<div class="cart-content">

  <h2>Корзина</h2>

  <div id="cartItems" class="cart-items"></div>

  <p id="cartTotal"></p>

  <button onclick="closeCart()">Закрыть</button>

</div>

</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script>

/* CAROUSEL */
const track = document.getElementById('track');
const dots = document.querySelectorAll('.dot');
let index = 0;

function update(){
  track.style.transform = `translateX(-${index*100}%)`;
}

setInterval(()=>{
  index++;
  if(index>2) index=0;
  update();
},3000);

/* CART SAFE VERSION */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(name, price){

  price = Number(price); // 🔥 FIX NaN

  let item = cart.find(i=>i.name===name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  updateCart();
  showToast("Добавлено");
}

function updateCart(){

  document.getElementById("cartCount").innerText =
    cart.reduce((a,b)=>a + (b.qty || 0), 0);

  let html = "";
  let total = 0;

  cart.forEach(i=>{
    total += i.price * i.qty;

    html += `
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price * i.qty} ₽</span>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("cartTotal").innerText = "Итого: " + total + " ₽";
}

function showToast(text){
  let t = document.getElementById("toast");
  t.innerText = text;
  t.classList.add("show");

  setTimeout(()=>t.classList.remove("show"),1500);
}

updateCart();

</script>

</body>
</html>
