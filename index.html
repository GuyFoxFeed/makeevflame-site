<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAKEEVFLAME</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#e8e8ec;
    color:white;

    font-family:Arial, sans-serif;
}

/* HERO */

.hero{

    width:100%;
    height:80vh;

    overflow:hidden;
}

.hero img{

    width:100%;
    height:100%;

    object-fit:cover;
}

/* CONTENT */

.content{

    display:grid;

    grid-template-columns:1fr;

    gap:24px;

    padding:24px;
}

/* BLOCKS */

.block{

    background:#181818;

    border-radius:28px;

    padding:24px;
}

/* DESKTOP */

@media(min-width:1024px){

    .content{

        grid-template-columns:1fr 1fr;

        align-items:start;
    }

}

</style>

</head>

<body>

<!-- HERO -->

<section class="hero">

<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=2000&auto=format&fit=crop">

</section>

<!-- CONTENT -->

<section class="content">

<div class="block">

<h2>Карусель</h2>

<p>
Тут позже будет твоя carousel/gallery.
</p>

</div>

<div class="block">

<h2>MAKEEV</h2>

<p>
Тут будет:
описание бренда,
информация,
доставка,
размеры,
кнопки.
</p>

</div>

</section>

</body>
</html>
