<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* HERO */
.hero{
  width:100%;
  height:50vh;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NAV */
.nav{
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:15px;
}

.nav a{
  color:white;
  text-decoration:none;
}

/* CONTENT GRID (СТАБИЛЬНЫЙ) */
.content{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  color:white;
  padding:20px;
}

/* SHOP (ОТДЕЛЬНО ОТ GRID) */
.shop{
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  margin-bottom:30px;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.product{
  background:#131313;
  color:white;
  padding:15px;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product button{
  margin-top:10px;
  padding:10px;
  background:white;
  border:none;
  cursor:pointer;
}

/* CART FLOAT */
.cart-float{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  background:#131313;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  cursor:pointer;
  z-index:999;
}

#cartCountNav{
  font-size:12px;
  margin-left:5px;
  color:#aaa;
}

/* CART DRAWER */
.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:flex-end;
}

.cart-drawer{
  width:420px;
  background:#111;
  color:white;
  height:100%;
  padding:20px;
  display:flex;
  flex-direction:column;
}

.cart-items{
  flex:1;
  overflow:auto;
  margin-top:10px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#1b1b1b;
  margin-bottom:8px;
}

.cart-total{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #333;
}

/* CHECKOUT FORM */
.checkout{
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.checkout input{
  padding:10px;
  border:none;
  outline:none;
}

/* CDEK */
.cdek{
  margin-top:10px;
  padding:10px;
  background:#1b1b1b;
}

/* FOOTER */
.footer{
  background:#131313;
  color:white;
  padding:30px;
  text-align:left;
  font-size:13px;
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/main/Desktop.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина <span id="cartCountNav">0</span></a>
</nav>

<!-- CONTENT -->
<section class="content">

  <div class="block">
    <h2>О бренде</h2>
    <p>Свечи ручной работы</p>
  </div>

  <div class="block">
    <h2>Инфо</h2>
    <p>Мини бренд-магазин</p>
  </div>

</section>

<!-- SHOP -->
<section class="shop" id="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602526219685">
    <h3>Свеча 1</h3>
    <button onclick="addToCart('Свеча 1',1290)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602874801006">
    <h3>Свеча 2</h3>
    <button onclick="addToCart('Свеча 2',1490)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1616628182506">
    <h3>Свеча 3</h3>
    <button onclick="addToCart('Свеча 3',1590)">Купить</button>
  </div>

</div>

</section>

<!-- FOOTER -->
<footer class="footer">
  © 2026 MAKEEV — юридическая информация
</footer>

<!-- CART -->
<div id="cartModal" class="cart-overlay">
  <div class="cart-drawer">

    <h2>Корзина</h2>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-total" id="cartTotal">Итого: 0 ₽</div>

    <!-- USER DATA -->
    <div class="checkout">
      <input placeholder="Имя">
      <input placeholder="Телефон">
      <input placeholder="Email">
      <input placeholder="Адрес">
    </div>

    <!-- CDEK -->
    <div class="cdek">
      Доставка СДЭК (подключим API позже)
    </div>

  </div>
</div>

<!-- FLOAT -->
<div class="cart-float" id="cartFloat">🛒</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){

  let item = cart.find(i => i.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price, qty:1});
  }

  save();
  updateCart();
}

function updateCart(){

  let totalQty = cart.reduce((a,b)=>a+b.qty,0);
  let totalPrice = cart.reduce((a,b)=>a+b.qty*b.price,0);

  document.getElementById("cartCountNav").innerText = totalQty;

  let html = "";

  cart.forEach((i,idx)=>{
    html += `
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price * i.qty} ₽</span>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("cartTotal").innerText = "Итого: " + totalPrice + " ₽";
}

/* OPEN */
function openCart(){
  document.getElementById("cartModal").style.display="flex";
}

/* CLOSE */
document.getElementById("cartModal").onclick = (e)=>{
  if(e.target.id === "cartModal"){
    document.getElementById("cartModal").style.display="none";
  }
};

document.getElementById("cartBtn").onclick = (e)=>{
  e.preventDefault();
  openCart();
};

document.getElementById("cartFloat").onclick = openCart;

updateCart();

</script>

</body>
</html>
