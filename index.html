<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* HERO */
.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NAV */
.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px;
}

.nav a{
  color:white;
  text-decoration:none;
}

/* GRID */
.content{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */
.carousel{
  overflow:hidden;
}

.carousel-track{
  display:flex;
  transition:transform 0.5s ease;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* DOTS */
.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#666;
  cursor:pointer;
}

.dot.active{
  background:white;
}

/* SHOP */
.shop{
  grid-column:1 / -1;
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
}

.product{
  background:#131313;
  color:white;
  padding:10px;
  border-radius:10px;
}

.product img{
  width:100%;
  height:200px;
  object-fit:cover;
}

/* BUTTON */
.product button{
  margin-top:10px;
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
  transition:0.15s;
}

.product button:active{
  transform:scale(0.96);
}

/* FOOTER */
.footer{
  background:#131313;
  color:white;
  padding:30px;
}

.footer-content{
  max-width:900px;
  margin:0;
  text-align:left;
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  opacity:0.8;
}

/* FLOAT CART */
.cart-float{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#131313;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  z-index:1000;
}

.cart-icon{
  width:18px;
  height:14px;
  border:2px solid white;
  border-radius:3px;
  position:relative;
}

.cart-icon::before{
  content:"";
  position:absolute;
  top:-6px;
  left:2px;
  width:12px;
  height:6px;
  border:2px solid white;
  border-bottom:none;
  border-radius:6px 6px 0 0;
}

#cartBubble{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  width:20px;
  height:20px;
  font-size:12px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* DRAWER OVERLAY */
.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
  display:none;
  justify-content:flex-end;
  z-index:9999;
}

/* DRAWER */
.cart-drawer{
  width:380px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:0.35s ease;
}

.cart-overlay.active .cart-drawer{
  transform:translateX(0);
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.cart-header button{
  background:none;
  border:none;
  color:white;
  font-size:20px;
  cursor:pointer;
}

.cart-items{
  flex:1;
  overflow:auto;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#1b1b1b;
  margin-bottom:10px;
  animation:fadeIn 0.25s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}

.cart-item button{
  background:red;
  color:white;
  border:none;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
  .content{
    grid-template-columns:1fr;
  }

  .shop-grid{
    grid-template-columns:1fr;
  }

  .slide{
    height:350px;
  }
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина</a>
</nav>

<!-- CONTENT -->
<section class="content">

<!-- CAROUSEL -->
<div class="block">

  <div class="carousel">
    <div class="carousel-track" id="track">

      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_5047.jpeg?raw=true')"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4876.jpg?raw=true')"></div>
      <div class="slide" style="background-image:url('https://github.com/GuyFoxFeed/makeevflame-site/blob/main/IMG_4825.jpeg?raw=true')"></div>

    </div>
  </div>

  <div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</div>

<!-- ABOUT -->
<div class="block">
  <h2>О бренде</h2>
  <p>Свечи ручной работы</p>
</div>

<!-- SHOP -->
<section class="shop" id="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602526219685-1f3b9b7b9b7b">
    <h3>Свеча 1</h3>
    <button onclick="addToCart('Свеча 1',1290)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602874801006-5c6a3f0c4f13">
    <h3>Свеча 2</h3>
    <button onclick="addToCart('Свеча 2',1490)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1616628182506-6c3a0f7c3b8c">
    <h3>Свеча 3</h3>
    <button onclick="addToCart('Свеча 3',1590)">Купить</button>
  </div>

</div>

</section>

</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <p>© 2026 MAKEEV. Все права защищены.</p>
    <p>НПД: Макеева Екатерина Игоревна</p>
    <p>ИНН: 631406784709</p>
    <p>+7 917 159 74 55</p>
  </div>
</footer>

<!-- CART DRAWER -->
<div id="cartModal" class="cart-overlay">
  <div class="cart-drawer">

    <div class="cart-header">
      <h2>Корзина</h2>
      <button onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

  </div>
</div>

<!-- FLOAT CART -->
<div id="cartFloat" class="cart-float">
  <div class="cart-icon"></div>
  <span id="cartBubble">0</span>
</div>

<script>

/* CAROUSEL */
const track = document.getElementById("track");
const dots = document.querySelectorAll(".dot");

let index = 0;

function updateCarousel(){
  track.style.transform = `translateX(-${index * 100}%)`;
  dots.forEach(d => d.classList.remove("active"));
  if(dots[index]) dots[index].classList.add("active");
}

dots.forEach((dot,i)=>{
  dot.addEventListener("click",()=>{
    index = i;
    updateCarousel();
  });
});

setInterval(()=>{
  index++;
  if(index > 2) index = 0;
  updateCarousel();
},4000);

/* CART */
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){

  let item = cart.find(i => i.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price:Number(price), qty:1});
  }

  save();
  updateCart();
}

function removeItem(i){
  cart.splice(i,1);
  save();
  updateCart();
}

function updateCart(){

  let totalQty = cart.reduce((a,b)=>a+b.qty,0);

  document.getElementById("cartBubble").innerText = totalQty;

  let html = "";

  cart.forEach((i,idx)=>{
    html += `
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price * i.qty} ₽</span>
        <button onclick="removeItem(${idx})">×</button>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
}

/* OPEN / CLOSE DRAWER */
function openCart(){
  const modal = document.getElementById("cartModal");
  modal.style.display = "flex";
  setTimeout(()=> modal.classList.add("active"), 10);
}

function closeCart(){
  const modal = document.getElementById("cartModal");
  modal.classList.remove("active");
  setTimeout(()=> modal.style.display = "none", 300);
}

/* EVENTS */
document.getElementById("cartFloat").addEventListener("click", openCart);

document.getElementById("cartBtn").addEventListener("click",(e)=>{
  e.preventDefault();
  openCart();
});

document.getElementById("cartModal").addEventListener("click",(e)=>{
  if(e.target.id === "cartModal") closeCart();
});

updateCart();

</script>

</body>
</html>
