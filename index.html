<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAKEEV свечи ручной работы</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial,sans-serif;
  color:white;
  overflow-x:hidden;
}

/* DESKTOP HERO */
.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MOBILE HERO */
.mobile-hero{
  display:none;
  width:100%;
  height:70vh;
  background:url("your-image.jpg") center/cover no-repeat;
  position:relative;
  color:white;
}

/* затемнение */
.mobile-hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.mobile-hero__content{
  position:relative;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:24px;
  gap:10px;
}

.btn{
  display:inline-block;
  padding:12px 18px;
  background:white;
  color:black;
  text-decoration:none;
  border-radius:10px;
  width:fit-content;
}

/* CONTENT */
.content{
  padding:40px 20px;
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
}

/* BLOCK */
.block{
  background:#131313;
  border-radius:0px;
  padding:24px;
}

/* SWITCH MOBILE / DESKTOP */
@media (max-width: 768px){

  .hero{
    display:none;
  }

  .mobile-hero{
    display:block;
  }
}

</style>
</head>

<body>

<!-- DESKTOP HERO -->
<div class="hero">
  <img src="your-desktop-image.jpg" alt="MAKEEV candles">
</div>

<!-- MOBILE HERO -->
<div class="mobile-hero">
  <div class="mobile-hero__content">
    <h1>MAKEEV</h1>
    <p>Свечи ручной работы</p>
    <a href="#shop" class="btn">Смотреть</a>
  </div>
</div>

<!-- CONTENT -->
<div class="content">

  <div class="block">
    Блок 1
  </div>

  <div class="block">
    Блок 2
  </div>

</div>

</body>
</html>
