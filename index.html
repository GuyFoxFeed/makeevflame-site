<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAKEEV</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* HERO */
.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* NAV */
.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px;
}

.nav a{
  color:white;
  text-decoration:none;
}

/* GRID */
.content{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:40px;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */
.carousel-track{
  display:flex;
  transition:transform 0.5s ease;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* DOTS */
.dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#666;
}

.dot.active{
  background:white;
}

/* SHOP */
.shop{
  grid-column:1 / -1;
  padding:60px 20px;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
}

.product{
  background:#131313;
  padding:10px;
  border-radius:10px;
  color:white;
}

.product img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.product button{
  margin-top:10px;
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
}

/* FOOTER */
.footer{
  background:#131313;
  color:white;
  padding:30px;
}

.footer-content{
  max-width:900px;
  text-align:left;
  font-size:13px;
  opacity:0.8;
}

/* CART DRAWER */
.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  backdrop-filter: blur(6px);
  display:none;
  justify-content:flex-end;
  z-index:9999;
}

.cart-drawer{
  width:420px;
  height:100%;
  background:#111;
  color:white;
  padding:20px;
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:0.35s;
}

.cart-overlay.active .cart-drawer{
  transform:translateX(0);
}

/* CART HEADER */
.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

/* CART ITEMS */
.cart-items{
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.cart-item{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  align-items:center;
  background:#1b1b1b;
  padding:10px;
  border-radius:8px;
  animation:fadeIn 0.25s ease;
}

.cart-item button{
  background:red;
  border:none;
  color:white;
  cursor:pointer;
  padding:5px 8px;
  border-radius:5px;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(6px);}
  to{opacity:1; transform:translateY(0);}
}

/* TOTAL */
.cart-total{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #333;
  font-size:16px;
}

/* CDEK BLOCK */
.cdek-box{
  margin-top:15px;
  background:#1b1b1b;
  padding:10px;
  border-radius:8px;
}

.cdek-box input{
  width:100%;
  padding:10px;
  margin-top:5px;
}

/* FLOAT CART */
.cart-float{
  position:fixed;
  bottom:20px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#131313;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:10000;
}

.cart-icon{
  width:18px;
  height:14px;
  border:2px solid white;
  border-radius:3px;
  position:relative;
}

.cart-icon::before{
  content:"";
  position:absolute;
  top:-6px;
  left:2px;
  width:12px;
  height:6px;
  border:2px solid white;
  border-bottom:none;
  border-radius:6px 6px 0 0;
}

#cartBubble{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  width:20px;
  height:20px;
  font-size:12px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

/* MOBILE */
@media(max-width:768px){
  .content{
    grid-template-columns:1fr;
  }

  .shop-grid{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">Корзина</a>
</nav>

<!-- CONTENT -->
<section class="content">

<div class="block">
  <h2>О бренде</h2>
</div>

</section>

<!-- SHOP -->
<section class="shop" id="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602526219685">
    <h3>Свеча 1</h3>
    <button onclick="addToCart('Свеча 1',1290)">Купить</button>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1602874801006">
    <h3>Свеча 2</h3>
    <button onclick="addToCart('Свеча 2',1490)">Купить</button>
  </div>

</div>

</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-content">
    <p>© 2026 MAKEEV</p>
  </div>
</footer>

<!-- CART -->
<div id="cartModal" class="cart-overlay">
  <div class="cart-drawer">

    <div class="cart-header">
      <h2>Корзина</h2>
      <button onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems" class="cart-items"></div>

    <div class="cart-total" id="cartTotal">
      Итого: 0 ₽
    </div>

    <!-- CDEK UI -->
    <div class="cdek-box">
      <h4>Доставка СДЭК</h4>
      <input placeholder="Город доставки">
    </div>

  </div>
</div>

<!-- FLOAT CART -->
<div id="cartFloat" class="cart-float">
  <div class="cart-icon"></div>
  <span id="cartBubble">0</span>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function save(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){

  let item = cart.find(i => i.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({name, price:Number(price), qty:1});
  }

  save();
  updateCart();
}

function removeItem(i){
  cart.splice(i,1);
  save();
  updateCart();
}

function updateCart(){

  let totalQty = cart.reduce((a,b)=>a+b.qty,0);
  let totalPrice = cart.reduce((a,b)=>a+b.qty*b.price,0);

  document.getElementById("cartBubble").innerText = totalQty;

  let html = "";

  cart.forEach((i,idx)=>{
    html += `
      <div class="cart-item">
        <span>${i.name} × ${i.qty}</span>
        <span>${i.price * i.qty} ₽</span>
        <button onclick="removeItem(${idx})">×</button>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("cartTotal").innerText = "Итого: " + totalPrice + " ₽";
}

/* CART OPEN */
function openCart(){
  const m = document.getElementById("cartModal");
  m.style.display="flex";
  setTimeout(()=>m.classList.add("active"),10);
}

function closeCart(){
  const m = document.getElementById("cartModal");
  m.classList.remove("active");
  setTimeout(()=>m.style.display="none",300);
}

document.getElementById("cartFloat").onclick = openCart;
document.getElementById("cartBtn").onclick = (e)=>{
  e.preventDefault();
  openCart();
};

updateCart();

</script>

</body>
</html>
