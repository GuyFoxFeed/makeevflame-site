<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAKEEV свечи ручной работы</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#e8e8ec;
  font-family:Helvetica, Arial, sans-serif;
  color:#e8e8ec;
  overflow-x:hidden;
}

/* NAV */

.nav{
  width:100%;
  background:#131313;
  display:flex;
  justify-content:center;
  gap:20px;
  padding:16px 10px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-size:14px;
  letter-spacing:1px;
}

/* HERO */

.hero{
  width:100%;
  height:50vh;
  overflow:hidden;
}

.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CONTENT */

.content{
  display:grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap:40px;
  align-items:start;
  padding:40px;
}

.block{
  background:#131313;
  padding:24px;
}

/* CAROUSEL */

.carousel-track{
  display:flex;
  transition:0.5s;
}

.slide{
  min-width:100%;
  height:500px;
  background-size:cover;
  background-position:center;
}

/* SHOP */

.shop{
  grid-column:1 / -1;
  padding:60px 20px;
  background:#e8e8ec;
}

.shop-title{
  text-align:center;
  font-size:28px;
  margin-bottom:30px;
  color:#131313;
}

.shop-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
  max-width:1100px;
  margin:0 auto;
}

.product{
  background:#131313;
  color:white;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.product img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
}

.product button{
  padding:10px;
  border:none;
  background:white;
  cursor:pointer;
}

/* CART */

.cart-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
}

.cart-content{
  background:white;
  color:black;
  padding:20px;
  width:320px;
  border-radius:10px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
}

.cart-item button{
  background:red;
  color:white;
  border:none;
  cursor:pointer;
}

</style>

</head>

<body>

<!-- HERO -->
<section class="hero">
  <img src="https://raw.githubusercontent.com/GuyFoxFeed/makeevflame-site/46f8f88f27366fa8dee80f06a5ff0aa880d29a0d/Desktop%20-%201.svg">
</section>

<!-- NAV -->
<nav class="nav">
  <a href="#">Главная</a>
  <a href="#about">О нас</a>
  <a href="#shop">Магазин</a>
  <a href="#" id="cartBtn">
    Корзина (<span id="cartCount">0</span>)
  </a>
</nav>

<!-- CONTENT -->
<section class="content">

<div class="block">
  <h2>О бренде</h2>
  <p>Текст...</p>
</div>

<!-- SHOP -->
<section class="shop" id="shop">

<h2 class="shop-title">Магазин</h2>

<div class="shop-grid">

  <div class="product">
    <img src="https://via.placeholder.com/400">
    <h3>Свеча 1</h3>
    <span>1290 ₽</span>
    <button onclick="addToCart('Свеча 1',1290)">Купить</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/400">
    <h3>Свеча 2</h3>
    <span>1490 ₽</span>
    <button onclick="addToCart('Свеча 2',1490)">Купить</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/400">
    <h3>Свеча 3</h3>
    <span>1590 ₽</span>
    <button onclick="addToCart('Свеча 3',1590)">Купить</button>
  </div>

</div>

</section>

</section>

<!-- CART -->
<div id="cartModal" class="cart-modal">

  <div class="cart-content">

    <h2>Корзина</h2>

    <div id="cartItems"></div>

    <p id="cartTotal">Итого: 0 ₽</p>

    <button onclick="closeCart()">Закрыть</button>

  </div>

</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name, price){
  cart.push({name, price});
  saveCart();
  updateCart();
}

function removeItem(i){
  cart.splice(i,1);
  saveCart();
  updateCart();
}

function updateCart(){

  document.getElementById("cartCount").innerText = cart.length;

  let items = document.getElementById("cartItems");
  items.innerHTML = "";

  let total = 0;

  cart.forEach((item,i)=>{
    total += item.price;

    items.innerHTML += `
      <div class="cart-item">
        <span>${item.name} - ${item.price} ₽</span>
        <button onclick="removeItem(${i})">x</button>
      </div>
    `;
  });

  document.getElementById("cartTotal").innerText =
    "Итого: " + total + " ₽";
}

document.getElementById("cartBtn").addEventListener("click",(e)=>{
  e.preventDefault();
  document.getElementById("cartModal").style.display="flex";
});

function closeCart(){
  document.getElementById("cartModal").style.display="none";
}

updateCart();

</script>

</body>
</html>
